<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Junior Sleuth Society</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&family=Patrick+Hand&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#5A2E1E;font-family:Nunito,'Trebuchet MS',sans-serif;color:#2B1A12}
button,input{font-family:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden}
.fred{font-family:Fredoka,'Trebuchet MS',sans-serif}
.hand{font-family:'Patrick Hand',cursive}

/* ---------- book shell ---------- */
.book{width:720px;height:960px;padding:18px;background:#5A2E1E;border-radius:28px;box-shadow:inset 0 0 0 4px #C9963F,inset 0 0 0 7px #3A1C12;display:flex;flex-direction:column}
.page{flex:1;min-height:0;background:#F6EBD3;border-radius:18px;border:3px dashed #C9A46A;padding:20px 24px 14px;display:flex;flex-direction:column;gap:14px;overflow:hidden;position:relative}
.hdr{display:flex;align-items:center;gap:14px}
.title{font-family:Fredoka,sans-serif;font-weight:700;font-size:30px;color:#5A2E1E;line-height:1.05}
.sub{font-family:'Patrick Hand',cursive;font-size:20px;color:#7A1F2B}
.round{width:48px;height:48px;border-radius:50%;border:3px solid #5A2E1E;background:#F6EBD3;display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.badge{width:64px;height:64px;border-radius:50%;background:#C9963F;border:4px solid #5A2E1E;display:flex;align-items:center;justify-content:center;flex:none}
.coins{display:flex;align-items:center;gap:8px;background:#5A2E1E;color:#F6EBD3;border-radius:999px;padding:8px 16px 8px 8px;flex:none}
.coins b{font-family:Fredoka,sans-serif;font-size:20px}
.coins span{font-size:13px;font-weight:800}
.tabs{display:flex;gap:8px}
.tabs button{flex:1;min-height:46px;border-radius:12px;font-family:Fredoka,sans-serif;font-weight:600;font-size:15px;border:3px solid #5A2E1E;background:#EBD9B4;color:#2B1A12;padding:0 2px}
.tabs button.on{background:#5A2E1E;color:#F6EBD3}
.btn{min-height:48px;border-radius:14px;border:3px solid #5A2E1E;font-family:Fredoka,sans-serif;font-weight:600;font-size:16px;padding:0 14px;background:#F6EBD3;color:#5A2E1E}
.btn.red{background:#8E2A35;color:#F6EBD3}
.btn.gold{background:#C9963F;color:#2B1A12}
.btn.pink{background:#E8739A;color:#2B1A12}
.btn:disabled,.btn.off{background:#E3D0AB;color:#5C4535;border-color:#C4AA7E}
.card{background:#FBF4E4;border:2px solid #C9A46A;border-radius:16px;padding:12px 14px}
.tan{background:#EBD9B4;border-radius:14px;padding:10px 14px}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
.h3{font-family:Fredoka,sans-serif;font-weight:600;font-size:20px}
.small{font-size:13px;font-weight:800;color:#5C4535}
.note{font-family:'Patrick Hand',cursive;font-size:18px;color:#5C4535;line-height:1.2}
.bar{height:20px;background:#F6EBD3;border-radius:999px;border:2px solid #5A2E1E;overflow:hidden}
.bar i{display:block;height:100%;background:#8E2A35;border-radius:999px}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;border-top:2px dashed #C9A46A;padding-top:10px;font-size:13px;font-weight:800;color:#5C4535}
.foot .hand{font-size:17px;font-weight:400}
.scroll{flex:1 1 0;min-height:0;overflow-y:auto;padding:6px 4px 6px 0}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.cardbtn{position:relative;min-height:122px;border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;text-align:center;background:#FBF4E4;border:3px solid #C9A46A;color:#2B1A12;font-family:Nunito,sans-serif}
.cardbtn.on{background:#EBD9B4;border-color:#5A2E1E}
.cardbtn.special{background:#FCE4EE;border-color:#E8739A}
.cardbtn .nm{font-weight:800;font-size:13px;line-height:1.15}
.tag{font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;background:#5A2E1E;color:#F6EBD3}
.tag.own{background:#E2E5CB;color:#4E5A23}
.tag.free{background:#F49AC1;color:#2B1A12}
.ribbon{position:absolute;top:-8px;right:-6px;background:#E8739A;color:#2B1A12;font-family:Fredoka,sans-serif;font-weight:700;font-size:12px;padding:2px 8px;border-radius:999px;border:2px solid #5A2E1E;transform:rotate(6deg)}
.mini{width:72px;height:76px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;border-radius:8px;background:#E8DCC2}
.sw{width:58px;height:58px;border-radius:50%;border:3px solid #5A2E1E;margin-bottom:6px}
.chips{display:flex;gap:6px}
.chips button{flex:1;min-height:40px;border-radius:999px;font-weight:800;font-size:13px;background:#FBF4E4;color:#2B1A12;border:2px solid #C9A46A;padding:0 2px}
.chips button.on{background:#7A1F2B;color:#F6EBD3;border-color:#7A1F2B}
.wear{display:flex;justify-content:space-between;gap:8px;background:#EBD9B4;border-radius:10px;padding:4px 10px;font-size:14px;font-weight:800}
.wear span:first-child{color:#5C4535}
.dot{width:12px;height:12px;border-radius:50%;background:#F6EBD3;border:2px solid #7A5418;display:inline-block}
.dot.on{background:#C9963F}
.pip{flex:1;height:10px;border-radius:999px;background:#E3D0AB}
.lock{background:#EFE6D2;border:2px dashed #C4AA7E}
.swatch{width:44px;height:44px;border-radius:50%;border:3px solid #C9A46A;padding:0}
.swatch.on{border:4px solid #5A2E1E;box-shadow:0 0 0 3px #C9963F}
.pillsel{flex:1;min-height:52px;border-radius:14px;font-family:Fredoka,sans-serif;font-weight:600;font-size:15px;line-height:1.1;padding:4px 6px;border:3px solid #5A2E1E;background:#EBD9B4;color:#2B1A12}
.pillsel.on{background:#5A2E1E;color:#F6EBD3}
.skillpick{min-height:132px;border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:#FBF4E4;border:3px solid #C9A46A;color:#2B1A12}
.skillpick.on{background:#EBD9B4;border-color:#5A2E1E;box-shadow:0 0 0 3px #C9963F}
input.txt{min-height:48px;border-radius:14px;border:3px solid #5A2E1E;background:#FBF4E4;padding:0 14px;font-family:Fredoka,sans-serif;font-weight:500;font-size:20px;color:#2B1A12;width:100%}
.tape{position:absolute;width:80px;height:22px;background:#7D8B4A;opacity:.85}
.ladder{display:flex;gap:8px}
.ladder div{flex:1;border-radius:12px;padding:8px 4px;text-align:center;font-size:13px;font-weight:800;background:#E3D0AB;color:#5C4535}
.ladder div.done{background:#5A2E1E;color:#F6EBD3}
.ladder div.now{background:#C9963F;color:#2B1A12;border:2px solid #5A2E1E}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:30px 20px}

/* ---------- pill ---------- */
.pill{width:400px;height:100px;border-radius:999px;background:#5A2E1E;border:4px solid #C9963F;display:flex;align-items:center;gap:12px;padding:0 20px 0 10px}
.pill .face{width:76px;height:76px;border-radius:50%;background:#E8DCC2;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;flex:none;border:3px solid #C9963F}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-160%);transition:transform .35s ease;z-index:9;background:#FBF4E4;border:3px solid #5A2E1E;border-radius:16px;padding:12px 18px;font-weight:800;font-size:16px;max-width:90%;text-align:center;box-shadow:0 6px 0 #5A2E1E}
#toast.show{transform:translate(-50%,0)}
#toast.bad{border-color:#7A1F2B;box-shadow:0 6px 0 #7A1F2B;color:#7A1F2B}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
.loading{width:720px;height:960px;display:flex;align-items:center;justify-content:center;color:#F6EBD3;font-family:Fredoka,sans-serif;font-size:26px;text-align:center;padding:40px}
</style>
</head>
<body>
<div id="stage"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
function sleuthVals(p, gid) {
    
    
    var size = Number(p.size ?? 200);
    var OL = '#5A2E1E';
    var HF = 'url(#' + gid + ')';

    var P = function (d, o) {
      o = o || {};

    var rect = function (x, y, w, h, r) {
      if (!r) return 'M' + x + ' ' + y + ' h' + w + ' v' + h + ' h' + (-w) + ' Z';

      var s = '';
      for (var i = 0; i < 10; i++) {

        var rr = i % 2 ? r : R;

      }
      return s + 'Z';
    };
    var heart = function (cx, cy, k) {
      var H = [12, 20, 4, 14, 3, 8, 7.5, 6.5, 10, 5.7, 12, 8, 12, 9, 12, 8, 14, 5.7, 16.5, 6.5, 21, 8, 20, 14, 12, 20];
      var q = function (i) { return (cx + (H[i] - 12) * k).toFixed(1) + ' ' + (cy + (H[i + 1] - 13) * k).toFixed(1); };

      sidepart: { f: [hf('M40 96 Q38 44 92 38 L96 52 Q100 40 110 38 Q162 42 160 96 Q152 70 130 64 Q116 60 98 62 Q76 66 60 76 Q46 84 40 96 Z'), P('M93 40 L97 58', { s: OL, w: 2 })], span: [38, 96] },

      halfup: { b: [hb('M34 110 Q28 38 100 34 Q172 38 166 110 L168 156 Q156 166 146 156 L146 118 L54 118 L54 156 Q44 166 32 156 Z'), hb(circ(100, 28, 17))], f: [hf('M42 96 Q44 44 100 42 Q156 44 158 96 Q146 70 120 70 Q100 76 80 70 Q54 70 42 96 Z')], span: [11, 162] },
      bubble: { o: flat([bubL.map(function (q) { return P(circ(q[0], q[1], q[2]), { f: HF, s: OL, w: 3 }); }), bubL.map(function (q) { return P(circ(200 - q[0], q[1], q[2]), { f: HF, s: OL, w: 3 }); }), [P(rect(21, 135, 18, 5, 2), { f: TIE, s: OL, w: 1.5 }), P(rect(20, 162, 19, 5, 2), { f: TIE, s: OL, w: 1.5 }), P(rect(161, 135, 18, 5, 2), { f: TIE, s: OL, w: 1.5 }), P(rect(161, 162, 19, 5, 2), { f: TIE, s: OL, w: 1.5 })]]), f: [hf(FR_PIG)], span: [38, 190] },
      pixie: { f: [hf('M42 100 Q36 40 100 38 Q164 40 158 98 Q154 84 148 86 Q150 72 136 66 Q118 58 96 66 Q76 74 60 72 Q52 84 48 82 Q44 92 42 100 Z'), hf('M40 98 Q36 112 44 122 Q47 108 47 98 Z'), hf('M160 98 Q164 112 156 122 Q153 108 153 98 Z')], span: [38, 122] },

      minilocs: {

        f: [hf(LOC_TOP), LOC_ROWS].concat(dreads(['M44 86 Q37 110 42 138', 'M62 70 Q57 82 60 95', 'M77 64 Q72 78 75 93', 'M92 61 Q89 76 92 91'], 6.5, true)),
        span: [34, 152]
      },
      longlocs: {
        b: dreads(['M34 96 Q25 130 33 160 Q40 186 31 212', 'M45 104 Q38 140 45 170 Q51 194 44 214', 'M57 112 Q51 146 57 176 Q61 196 56 212'], 8, true),
        f: [hf(LOC_TOP), LOC_ROWS].concat(dreads(['M42 90 Q33 120 40 150 Q47 176 40 202'], 8, true), dreads(['M68 68 Q58 80 61 96', 'M84 62 Q77 76 80 93'], 7, false)),

    }
    var unownedCur = ['bg', 'frame', 'expr'].map(function (k) { return catBy(k, cur[k]); }).filter(function (c) { return c && !owned[c.itemId]; });
    var changed = JSON.stringify(cur) !== JSON.stringify(p.photo);
    var canSave = changed && !unownedCur.length;
    var cap = (p.sleuthName || '') + (p.look.pet && p.petName ? ' & ' + p.petName : '');
    h += '<div class="row" style="gap:18px;align-items:center"><div style="transform:rotate(-2deg);flex:none">' + snapshot(p.look, cur, cap, 230) + '</div><div class="grow col" style="gap:8px"><div class="h3" style="font-size:18px">This snapshot</div>' +
      ['bg', 'frame', 'expr'].map(function (k) { return '<div class="wear" style="padding:6px 10px"><span>' + names[k] + '</span><span>' + esc(nameFor(k, cur[k])) + '</span></div>'; }).join('') + buy +
      '<div class="row" style="gap:8px;margin-top:4px"><button class="btn" data-act="resetPhoto" style="flex:1;font-size:15px">Reset Preview</button><button class="btn ' + (canSave ? 'red' : 'off') + '" data-act="savePhoto"' + (canSave ? '' : ' disabled') + ' style="flex:1;font-size:15px">Save Snapshot</button></div>' +
      (unownedCur.length ? '<span class="note" style="color:#7A1F2B">Buy ' + esc(unownedCur[0].name) + ' first, or pick something you own.</span>' : '') + '</div></div>';
    h += '<div class="tabs">' + [['bg', 'Backgrounds'], ['frame', 'Frames'], ['expr', 'Expressions']].map(function (t) { return '<button class="' + (b.tab === t[0] ? 'on' : '') + '" data-act="btab" data-arg="' + t[0] + '">' + t[1] + '</button>'; }).join('') + '</div>';
    var list = CAT.filter(function (c) { return c.category === 'photo' && c.slot === b.tab; });
    h += '<div class="scroll" id="grid"><div class="grid4">' + list.map(function (c) {
      var on = cur[c.slot] === c.assetRef, own = !!owned[c.itemId];
      var visual;
      if (c.slot === 'frame') visual = '<span style="display:block;padding:6px 6px 14px;margin-bottom:4px;background:' + FRAME_BG[c.assetRef] + ';border:' + FRAME_BORDER[c.assetRef] + ';box-shadow:0 2px 4px rgba(43,26,18,.2)"><span style="width:44px;height:48px;background:#E8DCC2;display:block"></span></span>';
      else visual = '<span class="mini">' + sleuthSVG(Object.assign({}, p.look, { hat: c.slot === 'expr' ? '' : p.look.hat, held: '', pet: '', back: '', bg: c.slot === 'bg' ? c.assetRef : '', expr: c.slot === 'expr' ? c.assetRef : 'happy' }), 70) + '</span>';
      var tag = own ? (on ? 'Using' : (c.price === 0 ? 'Free' : 'Owned')) : c.price + ' pennies' + (c.season ? ' · ' + c.season : '');
      return '<button class="cardbtn' + (on ? ' on' : '') + '" data-act="bpick" data-arg="' + c.itemId + '">' + visual + '<span class="nm">' + esc(c.name) + '</span><span class="tag' + (own ? ' own' : '') + '">' + esc(tag) + '</span></button>';
    }).join('') + '</div></div>';
    h += '<div class="foot"><span>Expressions are always free</span><span class="hand">saved snapshots show on your profile</span></div>';
    return book(h);
  }

  /* ---------- First-time setup ---------- */
  var STARTER_SKINS = [['#F6D3B3', 'Light skin'], ['#E8B48A', 'Medium-light skin'], ['#C68A5E', 'Medium-dark skin'], ['#8D5A3B', 'Dark skin']];
  var STARTER_HAIR = [['brown', '#6B3A1E', 'Brown hair'], ['black', '#2B1A12', 'Black hair'], ['blonde', '#D9A441', 'Blonde hair'], ['ginger', '#A8452A', 'Ginger hair']];
  function viewSetup() {
    var s = S.setup;
    var h = '<div class="hdr"><div class="badge">' + ICON.mag + '</div><div class="col" style="gap:2px"><div class="title">Welcome, new sleuth!</div><div class="sub" style="font-size:21px">Let\'s make your official casebook.</div></div></div>';
    h += '<div class="row"><label for="sname" class="fred" style="font-weight:600;font-size:18px;flex:none">Sleuth name</label><input id="sname" class="txt" maxlength="24" autocomplete="off" placeholder="What should we call you?" value="' + esc(s.name) + '" data-input="setupName"></div>';
    var look = { hairstyle: s.style, skin: s.skin, dye: s.hair, shirt: 'burgundy', held: 'mag' };
    h += '<div class="row" style="gap:22px"><div style="position:relative;transform:rotate(-3deg);flex:none">' + snapshot(look, { frame: 'polaroid', bg: '', expr: 'happy' }, 'this is you!', 210) + '<div class="tape" style="top:-12px;left:80px;transform:rotate(3deg)"></div></div><div class="grow col" style="gap:14px">' +
      '<div class="col" style="gap:8px"><div class="h3" style="font-size:18px">1 · Hair style</div><div class="row" style="gap:8px">' + [['pigtails', 'Pigtails'], ['short', 'Short &amp; Tousled'], ['bob', 'Curly Bob']].map(function (o) { return '<button class="pillsel' + (s.style === o[0] ? ' on' : '') + '" data-act="sstyle" data-arg="' + o[0] + '">' + o[1] + '</button>'; }).join('') + '</div></div>' +
      '<div class="col" style="gap:8px"><div class="h3" style="font-size:18px">2 · Skin</div><div class="row" style="gap:10px">' + STARTER_SKINS.map(function (o) { return '<button class="swatch' + (s.skin === o[0] ? ' on' : '') + '" style="background:' + o[0] + '" aria-label="' + o[1] + '" data-act="sskin" data-arg="' + o[0] + '"></button>'; }).join('') + '</div></div>' +
      '<div class="col" style="gap:8px"><div class="h3" style="font-size:18px">3 · Hair color</div><div class="row" style="gap:10px">' + STARTER_HAIR.map(function (o) { return '<button class="swatch' + (s.hair === o[0] ? ' on' : '') + '" style="background:' + o[1] + '" aria-label="' + o[2] + '" data-act="shair" data-arg="' + o[0] + '"></button>'; }).join('') + '</div></div></div></div>';
    h += '<div class="col" style="gap:8px"><div class="row" style="justify-content:space-between;align-items:baseline"><div class="h3" style="font-size:18px">4 · Pick your first skill</div><div class="note" style="font-size:17px">team up with friends who picked different ones!</div></div><div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px">' +
      SKILL_ORDER.map(function (k) { return '<button class="skillpick' + (s.skill === k ? ' on' : '') + '" data-act="sskill" data-arg="' + k + '">' + skillIcon(k, 28) + '<span style="font-weight:800;font-size:14px">' + SKILL[k].name + '</span><span style="font-size:12px;font-weight:700;color:#5C4535;line-height:1.2">' + SKILL[k].desc + '</span></button>'; }).join('') + '</div></div>';
    h += '<div class="row" style="margin-top:auto"><div class="grow note">Change your look anytime in the Snapshot Studio. Your first skill is yours forever!</div><button class="btn red" data-act="startCase" style="min-height:56px;font-size:19px;padding:0 22px">Start my casebook</button></div>';
    return book(h);
  }

  /* ============ render ============ */
  function render() {
    var keepScroll = document.getElementById('grid') ? document.getElementById('grid').scrollTop : 0;
    if (VIEW === 'pill') { stage.innerHTML = viewPill(); fit(); return; }
    if (!S.data) { stage.innerHTML = book('<div class="empty" style="flex:1"><div class="badge" style="width:84px;height:84px">' + ICON.mag + '</div><div class="title">' + esc(S.err || 'Opening your casebook…') + '</div></div>'); fit(); return; }
    var html = S.screen === 'setup' ? viewSetup() : S.screen === 'studio' ? viewStudio() : S.screen === 'booth' ? viewBooth() : viewJournal();
    stage.innerHTML = html;
    var g = document.getElementById('grid');
    if (g && keepScroll) g.scrollTop = keepScroll;
    fit();
  }

  function busy(promise) {
    S.busy = true;
    return promise.then(function (r) { S.busy = false; return r; }, function (e) { S.busy = false; throw e; });
  }

  function openStudio() {
    S.studio.draft = clone(S.data.player.look);
    S.studio.last = '';
    S.studio.petName = null;
    S.screen = 'studio';
  }

  function leaveStudio(next) {
    var st = S.studio, p = S.data.player;
    var jobs = [];
    if (st.petName != null && st.petName !== p.petName) {
      jobs.push(api('renamePet', [st.petName]).then(function (r) { if (r.ok) p.petName = r.petName; else toast(r.error, true); }));
    }
    if (draftChanged()) {
      // Keep everything they own; put back the saved choice for anything not bought yet.
      var keep = clone(st.draft), tookOff = false;
      Object.keys(keep).forEach(function (slot) {
        var c = catBy(slot, keep[slot]);
        if (c && !owned[c.itemId]) { keep[slot] = p.look[slot] || ''; tookOff = true; }
      });
      if (keep.petacc && !keep.pet) keep.petacc = '';
      if (JSON.stringify(keep) !== JSON.stringify(p.look)) {
        jobs.push(api('saveLook', [keep]).then(function (r) {
          if (r.ok) { p.look = r.look; toast(tookOff ? 'Outfit saved! (Things you haven\'t bought yet came off.)' : 'Outfit saved!'); } else toast(r.error, true);
        }));
      } else if (tookOff) toast('Took off things you haven\'t bought yet.');
    }
    S.screen = next;
    if (next === 'booth') { S.booth.cur = clone(p.photo); S.booth.last = ''; }
    render();
    return Promise.all(jobs).then(render);
  }

  /* ============ actions ============ */
  var ACT = {
    close: function () { tellHud('close'); },
    tab: function (a) { S.tab = a; render(); },
    go: function (a) {
      if (S.screen === 'studio') { leaveStudio(a === 'studio' ? 'journal' : a); return; }
      if (a === 'studio') openStudio();
      else if (a === 'booth') { S.booth.cur = clone(S.data.player.photo); S.booth.last = ''; S.screen = 'booth'; }
      else S.screen = a;
      render();
    },
    leaveStudio: function () { leaveStudio('journal'); },
    cat: function (a) { S.studio.cat = a; render(); var g = document.getElementById('grid'); if (g) g.scrollTop = 0; },
    chip: function (a) { S.studio.slot = a; render(); var g = document.getElementById('grid'); if (g) g.scrollTop = 0; },
    pick: function (id) {
      var c = catId(id); if (!c) return;
      var d = S.studio.draft;
      if (TOGGLE_CATS[c.category] && d[c.slot] === c.assetRef) { d[c.slot] = ''; if (c.slot === 'pet') d.petacc = ''; S.studio.last = ''; }
      else { d[c.slot] = c.assetRef; S.studio.last = c.itemId; }
      render();
    },
    split: function (a) { var parts = a.split('|'); S.studio.draft[parts[0]] = parts[1]; render(); },
    undoLook: function () { S.studio.draft = clone(S.data.player.look); S.studio.last = ''; render(); },
    saveLook: function () {
      if (S.busy) return;
      busy(api('saveLook', [S.studio.draft])).then(function (r) {
        if (r.ok) { S.data.player.look = r.look; S.studio.draft = clone(r.look); toast('Outfit saved!'); } else toast(r.error, true);
        render();
      });
    },
    buy: function (id) {
      if (S.busy) return;
      var c = catId(id);
      busy(api('buy', [id, rid()])).then(function (r) {
        if (r.ok) { owned[id] = true; S.data.player.pennies = r.pennies; toast(c && c.price === 0 ? c.name + ' is yours!' : 'Bought ' + (c ? c.name : 'it') + '!'); }
        else toast(r.error, true);
        render();
      });
    },
    btab: function (a) { S.booth.tab = a; render(); var g = document.getElementById('grid'); if (g) g.scrollTop = 0; },
    bpick: function (id) { var c = catId(id); if (!c) return; S.booth.cur[c.slot] = c.assetRef; S.booth.last = c.itemId; render(); },
    resetPhoto: function () { S.booth.cur = clone(S.data.player.photo); S.booth.last = ''; render(); toast('Back to your saved snapshot.'); },
    savePhoto: function () {
      if (S.busy) return;
      busy(api('savePhoto', [S.booth.cur])).then(function (r) {
        if (r.ok) { S.data.player.photo = r.photo; toast('Saved! Your profile shows this snapshot now.'); } else toast(r.error, true);
        render();
      });
    },
    allowance: function () {
      if (S.busy) return;
      busy(api('collectAllowance', [rid()])).then(function (r) {
        if (r.ok) { S.data.player.pennies = r.pennies; S.data.player.allowanceReady = false; toast(r.added ? '+' + r.added + ' pennies! Spend them wisely, detective.' : 'Already collected this week.'); }
        else toast(r.error, true);
        render();
      });
    },
    perm: function (a) {
      if (S.busy) return;
      busy(api('setJournalPerm', [a])).then(function (r) { if (r.ok) S.data.player.journalPerm = r.journalPerm; else toast(r.error, true); render(); });
    },
    sstyle: function (a) { S.setup.style = a; render(); },
    sskin: function (a) { S.setup.skin = a; render(); },
    shair: function (a) { S.setup.hair = a; render(); },
    sskill: function (a) { S.setup.skill = a; render(); },
    startCase: function () {
      if (S.busy) return;
      var s = S.setup;
      if (s.name.trim().length < 2) { toast('Type your sleuth name first!', true); var el = document.getElementById('sname'); if (el) el.focus(); return; }
      busy(api('setup', [{ name: s.name, firstSkill: s.skill, hairstyle: s.style, dye: s.hair, skin: s.skin }])).then(function (r) {
        if (!r.ok) { toast(r.error, true); return; }
        S.screen = 'journal'; S.tab = 'profile';
        toast('Welcome to the Society, ' + r.sleuthName + '!');
        return load();
      });
    }
  };

  stage.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    var fn = ACT[el.getAttribute('data-act')];
    if (fn) fn(el.getAttribute('data-arg'));
  });
  stage.addEventListener('input', function (e) {
    var k = e.target.getAttribute('data-input');
    if (k === 'setupName') S.setup.name = e.target.value;
    if (k === 'petName') {
      var clean = e.target.value.replace(/[^A-Za-z '\-]/g, '').slice(0, 12);
      if (clean !== e.target.value) e.target.value = clean;
      S.studio.petName = clean;
    }
  });

  /* ============ start ============ */
  if (VIEW === 'pill') document.body.style.background = '#5A2E1E';
  render();
  load();
  if (VIEW === 'pill') setInterval(function () { load(true); }, 60000);
})();
</script>
</body>
</html>
